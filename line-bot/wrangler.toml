name = "the-1000-bot"
main = "worker.js"
compatibility_date = "2026-05-30"
workers_dev = true

# 観測ログを残す（任意・トラブル時の追跡用）
[observability]
enabled = true

# Secrets は別途 CLI で投入する（このファイルに書かない）:
